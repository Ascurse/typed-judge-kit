[project]
name = "typed-judge"
version = "0.2.0"
description = "Typed questions to a model, one batched call, verdict in code, thresholds calibrated on your own labels."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tj = "typed_judge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typed_judge"]

# hatchling читает только корневой .gitignore, поэтому .beads/backup (дампы Dolt, ~2 МБ)
# в sdist приходится отсекать явным списком, а не игнором
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not stress and not stress_v2'"
markers = [
    "network: требует реальных ключей API; гоняется вручную",
    "stress: гейт текущего конвейера на стресс-наборе h37 (пропуск критического → auto off); pytest -m stress",
    "stress_v2: тот же гейт для draft_lint_v2 без шага claim-vs-evidence — исторический замер, остаётся красным",
]
