[project]
name = "typed-judge"
version = "0.1.0"
description = "Typed questions to a model, one batched call, verdict in code, thresholds calibrated on your own labels."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tj = "typed_judge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typed_judge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: требует реальных ключей API; гоняется вручную"]
